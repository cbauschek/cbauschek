name: Generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff8a1f&color_dots=%23e3f6fa,%23a5e9f7,%2356d4ee,%2318b4d8,%230a7f9c
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff8a1f&color_dots=%23061217,%230b3a47,%230e6a80,%2318c8ee,%239af1ff

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
